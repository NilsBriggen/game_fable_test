<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>character sheet</title>
<style>html,body{margin:0;background:#8fa3b8}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Dev-only character sheet: vite dev server → /assets/characters/_sheet.html?ids=peasant,monk&dist=3
// (the world builder's public/assets/_sheet.html does the same for props). Renders spawnCharacter() output
// with the real materials, ticks the idle for `t` seconds, and exposes window.__sheetReady for Playwright.
import {
  Scene, PerspectiveCamera, WebGLRenderer, DirectionalLight, HemisphereLight, Group, PlaneGeometry, Mesh,
  MeshStandardMaterial, Vector3, Color, ACESFilmicToneMapping, SRGBColorSpace,
} from '/node_modules/three/build/three.module.js';
import { spawnCharacter, updateCharacters } from '/src/world/characters.ts';

const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'peasant').split(',');
const W = Number(q.get('w') || 1400), H = Number(q.get('h') || 800);
const dist = Number(q.get('dist') || 4);          // camera distance from the row centre
const yaw = Number(q.get('yaw') || 0.35);         // 0 = from the front (+Z)
const pitch = Number(q.get('pitch') || 0.08);
const focus = Number(q.get('focus') || 1.0);      // look-at height
const gap = Number(q.get('gap') || 0.9);
const t = Number(q.get('t') || 1.3);              // seconds of idle to tick before the shot
const anim = q.get('anim') || '';
const hour = Number(q.get('hour') || 11);

const renderer = new WebGLRenderer({ antialias: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = SRGBColorSpace;
renderer.toneMapping = ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.width = W + 'px';

const scene = new Scene();
scene.background = new Color(0x9fb4c8);
const cam = new PerspectiveCamera(38, W / H, 0.05, 200);
const sun = new DirectionalLight(0xfff2dd, hour >= 18 ? 1.2 : 2.6);
const el = hour >= 18 ? 0.25 : 0.9;
sun.position.set(6, 10 * el + 2, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new HemisphereLight(0xbfd4ea, 0x6b6350, 0.9));
const ground = new Mesh(new PlaneGeometry(60, 60), new MeshStandardMaterial({ color: 0x7a7550, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const root = new Group();
scene.add(root);
const handles = [];
for (let i = 0; i < ids.length; i++) {
  const [id, variant] = ids[i].split('/');
  const seedM = /seed(\d+)/.exec(variant || '');
  const h = spawnCharacter(id, { variant: variant && !seedM ? variant : undefined, seed: seedM ? Number(seedM[1]) : 7 + i * 13 });
  h.object.position.set((i - (ids.length - 1) / 2) * gap, 0, 0);
  root.add(h.object);
  handles.push(h);
}
// wait for the rig + textures
await new Promise((r) => setTimeout(r, 1500));
for (const h of handles) if (anim) h.play(anim);
for (let i = 0; i < Math.round(t * 60); i++) updateCharacters(1 / 60);

cam.position.set(Math.sin(yaw) * dist, focus + Math.sin(pitch) * dist, Math.cos(yaw) * dist);
cam.lookAt(new Vector3(0, focus, 0));
let frames = 0;
function frame() {
  updateCharacters(1 / 60);
  renderer.render(scene, cam);
  if (++frames === 8) {
    const info = renderer.info.render;
    window.__sheetStats = { drawCalls: info.calls, triangles: info.triangles };
    window.__sheetReady = true;
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
